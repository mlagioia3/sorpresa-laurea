<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upgrade di Sistema - Laurea</title>
    <style>
        body { background-color: #0d1117; color: #00ff00; font-family: 'Courier New', Courier, monospace; margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        #start-screen { height: 80vh; display: flex; flex-direction: column; justify-content: center; align-items: center; width: 100%; text-align: center; }
        #main-ui { display: none; width: 100%; max-width: 600px; }
        #terminal { width: 100%; background-color: #000; padding: 20px; border: 1px solid #333; border-radius: 8px; margin-bottom: 20px; box-shadow: 0 0 10px rgba(0, 255, 0, 0.2); box-sizing: border-box; }
        .content-box { width: 100%; background-color: #161b22; padding: 20px; border-radius: 8px; margin-bottom: 20px; display: none; text-align: center; box-sizing: border-box; }
        video { width: 100%; border-radius: 8px; margin-bottom: 20px; border: 1px solid #333; box-shadow: 0 0 10px rgba(0, 255, 0, 0.2); background-color: black; }
        h2 { color: #fff; margin-top: 0; }
        .btn { display: inline-block; background-color: #238636; color: white; padding: 15px 30px; text-decoration: none; border-radius: 8px; font-weight: bold; margin-top: 15px; font-size: 18px; border: none; cursor: pointer; }
        .btn:hover { background-color: #2ea043; }
        .cursor { animation: blink 1s infinite; }
        @keyframes blink { 0% { opacity: 1; } 50% { opacity: 0; } 100% { opacity: 1; } }
        .decoding { font-weight: bold; color: #ffeb3b; font-size: 1.2em; margin-bottom: 20px;}
    </style>
</head>
<body>

<div id="start-screen">
    <h2 style="color: #00ff00; margin-bottom: 20px;">SISTEMA BLOCCATO</h2>
    <p>È richiesta l'autenticazione del Dottorando per procedere.</p>
    <button class="btn" onclick="startExperience()">AVVIA PROTOCOLLO UPGRADE</button>
</div>

<div id="main-ui">
    <!-- Il tuo video caricato su GitHub partirà qui in alto -->
    <video id="myVideo" src="video.mp4" playsinline controls></video>
    
    <div id="terminal">
        <span id="text"></span><span class="cursor">_</span>
    </div>

    <div id="main-content" class="content-box">
        <h2>🎉 ERRORE 404: Studente non trovato 🎉</h2>
        <p><strong>UPGRADE A INGEGNERE COMPLETATO AL 100%</strong></p>
        
        <div style="margin-top: 30px;">
            <h3>📍 Decriptazione coordinate festeggiamento in corso...</h3>
            <p id="coordinates" class="decoding">01001110 01100101 01110010 01100100</p>
            
            <div id="map-container" style="display: none; margin-top: 15px;">
                <iframe width="100%" height="300" src="https://maps.google.com/maps?q=Ristorante%20Da%20Enrico%20Roma&t=&z=15&ie=UTF8&iwloc=&output=embed" frameborder="0" style="border:0;" allowfullscreen="" aria-hidden="false" tabindex="0"></iframe>
                <br>
                <a href="https://share.google/McxSrQS2HScjuO8AG" target="_blank" class="btn" style="font-size: 16px;">🧭 Avvia Navigatore verso "Da Enrico"</a>
            </div>
        </div>
    </div>
</div>

<script>
    const messages = [
        "Inizializzazione sistema...",
        "Ricerca utente: Dottorando...",
        "ERRORE 404: Studente non trovato.",
        "Ricerca alternativa: INGEGNERE INFORMATICO...",
        "Match trovato! Avvio protocollo di festeggiamento.",
        "Caricamento dati in corso [██████████] 100%",
        "Accesso consentito."
    ];
    
    const terminalText = document.getElementById('text');
    const mainContent = document.getElementById('main-content');
    let msgIndex = 0;
    let charIndex = 0;

    // Questa funzione scatta quando clicca il bottone
    function startExperience() {
        document.getElementById('start-screen').style.display = 'none';
        document.getElementById('main-ui').style.display = 'block';
        
        const vid = document.getElementById('myVideo');
        vid.play(); // Fa partire il video
        
        setTimeout(typeWriter, 500); // Fa partire il testo hacker sotto al video
    }

    function typeWriter() {
        if (msgIndex < messages.length) {
            if (charIndex < messages[msgIndex].length) {
                terminalText.innerHTML += messages[msgIndex].charAt(charIndex);
                charIndex++;
                setTimeout(typeWriter, 50);
            } else {
                terminalText.innerHTML += "<br>";
                msgIndex++;
                charIndex = 0;
                setTimeout(typeWriter, 800);
            }
        } else {
            setTimeout(() => {
                mainContent.style.display = "block";
                startDecoding();
            }, 1000);
        }
    }

    const finalCoordinates = "RISTORANTE DA ENRICO";
    const coordElement = document.getElementById('coordinates');
    const mapContainer = document.getElementById('map-container');

    function startDecoding() {
        let iterations = 0;
        const chars = "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789!@#$%^&*";
        
        const interval = setInterval(() => {
            coordElement.innerText = finalCoordinates.split('').map((letter, index) => {
                if (index < iterations) {
                    return finalCoordinates[index];
                }
                return chars[Math.floor(Math.random() * chars.length)];
            }).join('');
            
            if (iterations >= finalCoordinates.length) {
                clearInterval(interval);
                coordElement.style.color = "#00ff00";
                setTimeout(() => {
                    mapContainer.style.display = "block";
                }, 500);
            }
            iterations += 1/3; 
        }, 50);
    }
</script>
</body>
</html>
